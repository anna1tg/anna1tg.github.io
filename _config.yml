# ------------------------------------------------------------
#  Site settings — the only file you may need to edit once
# ------------------------------------------------------------
title: Anna Aleshko
tagline: AI-Powered Creative Director
description: >-
  Anna Aleshko is an AI-powered creative director from Kyiv working worldwide:
  strategy, brand identity, AI art, ads and consulting.
author: Anna Aleshko
image: /images/og-card.jpg
lang: en
locale: en_US

# Site address (GitHub username: anna1tg)
url: "https://annaaleshko.art"
baseurl: ""

social:
  name: Anna Aleshko
  links:
    - https://www.instagram.com/anna_aleshko_art/
    - https://www.tiktok.com/@anna_aleshko_art

email: an.aleshko@gmail.com
instagram: https://www.instagram.com/anna_aleshko_art/
tiktok: https://www.tiktok.com/@anna_aleshko_art
youtube: https://youtu.be/ew3CFQ9tVfA

# Payment links — paste your own links here, then the Pay buttons appear on the rates page.
# Leave empty ("") to hide a button.
payment:
  # Payoneer — for clients abroad. Paste your payoneer.me link or a request-a-payment link.
  intl: ""
  # For clients in Ukraine — leave empty for now. Paste a LiqPay / monobank / other link when ready.
  ua: ""
  # Optional note under the buttons
  note_en: "Invoice on request. 50% prepayment to start, the rest on delivery."
  note_uk: "Рахунок надсилаю на запит. 50% передоплати на старт, решта після здачі роботи."

# Google Search Console verification
webmaster_verifications:
  google: 6Huwoe8I26yUXQKMM9XkL7m0tn9DK1IaiAf0j0rNQcY

# Articles live at /blog/article-name/
permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: blog/feed.xml

defaults:
  # English articles: _posts/  ->  /blog/article-name/
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: en
      locale: en_US
  # Ukrainian articles: uk/_posts/  ->  /uk/blog/article-name/
  - scope:
      path: "uk"
      type: posts
    values:
      layout: post
      lang: uk
      locale: uk_UA
      permalink: /uk/blog/:title/
  - scope:
      path: "uk"
    values:
      lang: uk
      locale: uk_UA
      image: /images/og-card-uk.jpg

exclude:
  - HOW-TO.md
  - README.md
  - images/README.md
